services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:5000
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
      - qdrant
    environment:
      MONGO_URL: mongodb://mongo:27017/app
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      - redis
      - mongo
      - qdrant
    environment:
      MONGO_URL: mongodb://mongo:27017/app
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    restart: unless-stopped

  mongo:
    image: mongo:7
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    restart: unless-stopped
